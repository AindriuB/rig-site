name: pages

# Builds every docs version, the landing page and the changelog into a scratch
# gh-pages and runs every guard over it, on every pull request. Pushes the
# result to the gh-pages branch only from main, a `rig-release` repository
# dispatch (sent by rig when it tags a release) or a manual run.
#
# GitHub Pages must be set to serve the gh-pages branch: an owner action,
# done once, separately from this workflow.
on:
  push:
    branches: ["main"]
  pull_request:
  repository_dispatch:
    types: [rig-release]
  workflow_dispatch:

permissions:
  contents: read

# Only non-pull-request events on refs/heads/main share the deploy group and
# queue (never cancel a running deploy), so each build starts from the latest
# gh-pages. Pull requests and dispatches on any other ref get a per-ref group.
concurrency:
  group: pages-${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site-src/requirements.txt

      - name: Install the pinned toolchain
        run: pip install -r site-src/requirements.txt

      # Fetches origin/gh-pages, builds, and runs lychee (offline, pinned
      # image) and every site-src/checks/check_*.py. Never pushes.
      - name: Build the site and run every guard
        run: site-src/build/build.sh

      - name: Bundle the scratch gh-pages
        run: git -C .build/site-repo bundle create "$GITHUB_WORKSPACE/gh-pages.bundle" gh-pages

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gh-pages-bundle
          path: gh-pages.bundle
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'repository_dispatch' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: gh-pages-bundle

      # A plain push: it fails rather than overwrite gh-pages if the branch
      # moved since the build fetched it.
      - name: Push gh-pages
        run: |
          set -euo pipefail
          git fetch --quiet gh-pages.bundle gh-pages:refs/heads/gh-pages-new
          git push origin gh-pages-new:refs/heads/gh-pages
