<section class="slot" id="forges" aria-labelledby="forges-h">
  <h2 id="forges-h">One interface over two forges</h2>
  <p>The same commands and the same output work on GitHub and GitLab. rig runs <code>gh</code> or
  <code>glab</code> underneath and uses the login you already have. It stores a token only for Jira, which
  has no such tool, and then in the OS keychain.</p>
  <figure class="forges-figure">
    <svg class="forges-svg" viewBox="0 0 900 260" role="img" aria-labelledby="forges-title forges-desc">
      <title id="forges-title">rig reaches GitHub and GitLab through gh and glab, and Jira directly</title>
      <desc id="forges-desc">rig calls gh, which talks to GitHub, and calls glab, which talks to GitLab, both
      using the login you already have. rig reaches Jira directly with a token kept in the OS keychain.</desc>
      <g class="box"><rect x="20" y="95" width="120" height="70" rx="8"/><text class="label" x="80" y="137">rig</text></g>

      <path class="link" d="M140 130 H200 V50 H300"/>
      <path class="link" d="M140 130 H300"/>
      <path class="link link-direct" d="M140 130 H200 V210 H560"/>

      <g class="box"><rect x="300" y="20" width="120" height="60" rx="8"/><text class="mono" x="360" y="56">gh</text></g>
      <g class="box"><rect x="300" y="100" width="120" height="60" rx="8"/><text class="mono" x="360" y="136">glab</text></g>
      <path class="link" d="M420 50 H560"/>
      <path class="link" d="M420 130 H560"/>
      <g class="box"><rect x="560" y="20" width="140" height="60" rx="8"/><text class="label" x="630" y="56">GitHub</text></g>
      <g class="box"><rect x="560" y="100" width="140" height="60" rx="8"/><text class="label" x="630" y="136">GitLab</text></g>
      <g class="box"><rect x="560" y="180" width="140" height="60" rx="8"/><text class="label" x="630" y="216">Jira</text></g>

      <text class="note" x="730" y="56">the login you already have</text>
      <text class="note" x="730" y="136">the login you already have</text>
      <text class="note" x="730" y="216">token in the OS keychain</text>
      <text class="note" x="360" y="248">direct, no gh or glab</text>
    </svg>
    <figcaption>rig runs gh or glab underneath; Jira is reached directly.</figcaption>
  </figure>
</section>
