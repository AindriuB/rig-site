<section class="terminal-section" aria-labelledby="term-h">
  <h2 id="term-h">What it prints</h2>
  <p>Real output from rig 0.5.0: push a task branch, wait for CI, move the task to done.</p>
  <div class="terminal" role="group" aria-label="Terminal transcript">
    <div class="terminal-bar" aria-hidden="true"><span class="dot dot-red"></span><span class="dot dot-amber"></span><span class="dot dot-green"></span></div>
    <pre class="term-block" data-capture="push">{{capture:push}}</pre>
    <pre class="term-block" data-capture="pr-wait">{{capture:pr-wait}}</pre>
    <pre class="term-block" data-capture="task-move">{{capture:task-move}}</pre>
  </div>
</section>
